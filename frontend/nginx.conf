server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    # Connection tests can wait up to 120s for a provider; match the browser's
    # 150s request budget instead of cutting a valid request off at 60s.
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_connect_timeout 5s; proxy_read_timeout 150s; }
    location = /health { proxy_pass http://api:8000/health; }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        # A location-level add_header replaces inherited headers on nginx 1.28.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
